<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="460" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#111827">Trust vs. Scope (leak safety)</text>
  <text x="24" y="50" font-size="12" fill="#6b7280">Does a memory ever surface for an actor not authorized to see it?</text>

  <!-- org scope -->
  <rect x="60" y="90" width="520" height="300" rx="10" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="80" y="112" font-size="12" font-weight="600" fill="#374151">org scope "acme" — shared with every actor</text>

  <!-- user scope box -->
  <rect x="90" y="140" width="200" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="162" font-size="12" font-weight="600" fill="#1e3a8a" text-anchor="middle">user scope: alice</text>
  <circle cx="140" cy="200" r="5" fill="#2563eb"/>
  <text x="155" y="204" font-size="11" fill="#1e3a8a">alice's private memory</text>

  <!-- agent scope box -->
  <rect x="350" y="140" width="200" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="450" y="162" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">agent scope: "atlas"</text>
  <circle cx="400" cy="200" r="5" fill="#ea580c"/>
  <text x="415" y="204" font-size="11" fill="#9a3412">atlas's private memory</text>

  <!-- actor: bob querying alice's scope -->
  <circle cx="190" cy="320" r="16" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="190" y="325" font-size="11" fill="#374151" text-anchor="middle">bob</text>
  <line x1="190" y1="304" x2="175" y2="245" stroke="#dc2626" stroke-width="2"/>
  <text x="220" y="280" font-size="18" fill="#dc2626" font-weight="700">x</text>
  <text x="190" y="358" font-size="10" fill="#dc2626" text-anchor="middle">is_authorized(bob, alice's scope)</text>
  <text x="190" y="371" font-size="10" fill="#dc2626" text-anchor="middle">= false -&gt; blocked</text>

  <!-- actor: user atlas querying agent scope atlas (id collision) -->
  <circle cx="450" cy="320" r="16" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="450" y="325" font-size="11" fill="#374151" text-anchor="middle">user "atlas"</text>
  <line x1="450" y1="304" x2="420" y2="245" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="280" font-size="18" fill="#dc2626" font-weight="700">x</text>
  <text x="450" y="358" font-size="10" fill="#dc2626" text-anchor="middle">same id, wrong kind -&gt; still blocked</text>
  <text x="450" y="371" font-size="10" fill="#dc2626" text-anchor="middle">(checked in scoring.rs tests)</text>

  <rect x="24" y="420" width="592" height="22" fill="#f3f4f6"/>
  <text x="320" y="435" font-size="11" fill="#6b7280" text-anchor="middle">DIAGRAM — the authorization rule in scoring.rs::is_authorized / leak_rate. No live replay has computed a leak rate yet.</text>
</svg>
