<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="460" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#111827">Trust vs. Repetition (run-to-run stability)</text>
  <text x="24" y="50" font-size="12" fill="#6b7280">Same stream, same order, repeated: does the ranking agree with itself?</text>

  <!-- left panel: stable system -->
  <text x="160" y="80" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">A stable system</text>
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="60" y1="360" x2="280" y2="360"/>
    <line x1="60" y1="360" x2="60" y2="110"/>
  </g>
  <text x="30" y="365" font-size="10" fill="#6b7280">-1</text>
  <text x="30" y="240" font-size="10" fill="#6b7280">0</text>
  <text x="30" y="118" font-size="10" fill="#6b7280">1</text>
  <text x="170" y="400" font-size="11" fill="#6b7280" text-anchor="middle">replicate pairs (1-2, 1-3, 2-3)</text>
  <circle cx="110" cy="128" r="4" fill="#16a34a"/>
  <circle cx="170" cy="135" r="4" fill="#16a34a"/>
  <circle cx="230" cy="122" r="4" fill="#16a34a"/>
  <text x="170" y="100" font-size="10" fill="#16a34a" text-anchor="middle">rank_agreement near 1.0, tightly clustered</text>

  <!-- right panel: unstable system -->
  <text x="480" y="80" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">An unstable system</text>
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="380" y1="360" x2="600" y2="360"/>
    <line x1="380" y1="360" x2="380" y2="110"/>
  </g>
  <text x="350" y="365" font-size="10" fill="#6b7280">-1</text>
  <text x="350" y="240" font-size="10" fill="#6b7280">0</text>
  <text x="350" y="118" font-size="10" fill="#6b7280">1</text>
  <text x="490" y="400" font-size="11" fill="#6b7280" text-anchor="middle">replicate pairs (1-2, 1-3, 2-3)</text>
  <circle cx="430" cy="300" r="4" fill="#dc2626"/>
  <circle cx="490" cy="150" r="4" fill="#dc2626"/>
  <circle cx="550" cy="260" r="4" fill="#dc2626"/>
  <text x="490" y="100" font-size="10" fill="#dc2626" text-anchor="middle">rank_agreement scattered around 0</text>

  <rect x="24" y="430" width="592" height="22" fill="#f3f4f6"/>
  <text x="320" y="445" font-size="11" fill="#6b7280" text-anchor="middle">SCHEMATIC — shows what stability.rs's flip_rate / rank_agreement distinguish. No replicate run has been executed yet.</text>
</svg>
