    <path d="M181 170c38 28 72 42 128 36" stroke="#b0a2bd" stroke-width="8" opacity="0.34"/>
    <path d="M184 341c43-30 78-47 138-52" stroke="#b0a2bd" stroke-width="8" opacity="0.34"/>
