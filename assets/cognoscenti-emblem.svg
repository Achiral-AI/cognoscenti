  <circle cx="256" cy="256" r="205" fill="#140720"/>
  <circle cx="256" cy="256" r="191" fill="none" stroke="url(#rainbow)" stroke-width="18"/>
  <circle cx="256" cy="256" r="167" fill="url(#velvet)" stroke="url(#gold)" stroke-width="8"/>

