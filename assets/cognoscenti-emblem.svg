  <path d="M353 135c-43-18-95-8-129 26-50 50-50 131 0 181 34 34 86 44 129 26"
        fill="none" stroke="#f8efe0" stroke-width="16" stroke-linecap="round" opacity="0.92"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 257c37-34 78-49 125-44" stroke="#1f6f68" stroke-width="11"/>
    <path d="M177 257c39 29 81 41 126 34" stroke="#6f7c75" stroke-width="8" opacity="0.55"/>
    <path d="M204 177c24 18 46 30 82 36" stroke="#6f7c75" stroke-width="7" opacity="0.42"/>
    <path d="M207 337c28-20 51-35 91-46" stroke="#6f7c75" stroke-width="7" opacity="0.42"/>
  </g>

  <g>
    <circle cx="170" cy="257" r="20" fill="#142321"/>
    <circle cx="170" cy="257" r="9" fill="#f0d58a"/>
    <circle cx="204" cy="177" r="14" fill="#30423d" opacity="0.62"/>
    <circle cx="207" cy="337" r="14" fill="#30423d" opacity="0.62"/>
    <circle cx="303" cy="291" r="15" fill="#30423d" opacity="0.52"/>
    <circle cx="304" cy="213" r="17" fill="#1f6f68"/>
    <circle cx="304" cy="213" r="8" fill="#f8efe0"/>
  </g>

  <path d="M366 203c-20-28-61-36-91-18" fill="none" stroke="#142321" stroke-width="14" stroke-linecap="round"/>
