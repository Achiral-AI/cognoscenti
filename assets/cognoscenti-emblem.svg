    <circle cx="184" cy="341" r="18" fill="#38d66b" opacity="0.82"/>
    <circle cx="323" cy="290" r="20" fill="#22c7e8" opacity="0.78"/>
    <circle cx="329" cy="201" r="24" fill="#080a13" stroke="#d243ff" stroke-width="8"/>
