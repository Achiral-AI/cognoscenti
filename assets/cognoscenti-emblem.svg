<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cognoscenti emblem</title>
  <desc id="desc">A jewel-toned rainbow and gold aristocratic seal for Cognoscenti, combining a classical laurel medallion with a selective recall constellation.</desc>
  <defs>
    <radialGradient id="velvet" cx="50%" cy="45%" r="68%">
      <stop offset="0" stop-color="#3a0f36"/>
      <stop offset="0.54" stop-color="#130a2a"/>
      <stop offset="1" stop-color="#070812"/>
    </radialGradient>
    <radialGradient id="pearl" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff9e8"/>
      <stop offset="0.42" stop-color="#f4d58f"/>
      <stop offset="1" stop-color="#925f21"/>
    </radialGradient>
    <linearGradient id="gold" x1="86" y1="55" x2="434" y2="457" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.24" stop-color="#f4c75f"/>
      <stop offset="0.52" stop-color="#a66a1d"/>
      <stop offset="0.78" stop-color="#f6d674"/>
      <stop offset="1" stop-color="#6f3f12"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="96" y1="111" x2="415" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3864"/>
      <stop offset="0.16" stop-color="#ff8a1d"/>
      <stop offset="0.32" stop-color="#ffd84a"/>
      <stop offset="0.49" stop-color="#38d66b"/>
      <stop offset="0.66" stop-color="#22c7e8"/>
      <stop offset="0.82" stop-color="#5a6cff"/>
      <stop offset="1" stop-color="#d243ff"/>
    </linearGradient>
    <linearGradient id="memory-line" x1="143" y1="257" x2="379" y2="211" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.28" stop-color="#ff3864"/>
      <stop offset="0.55" stop-color="#22c7e8"/>
      <stop offset="1" stop-color="#d243ff"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-16%" width="132%" height="132%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#05030a" flood-opacity="0.42"/>
    </filter>
    <filter id="inner-glow" x="-18%" y="-18%" width="136%" height="136%">
