<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cognoscenti emblem</title>
  <desc id="desc">A classical circular seal with a selective recall network: one activated memory comes forward from quieter surrounding memories.</desc>
  <defs>
    <radialGradient id="seal-glow" cx="50%" cy="43%" r="62%">
      <stop offset="0" stop-color="#f6f0e6"/>
      <stop offset="0.62" stop-color="#d8c7a1"/>
      <stop offset="1" stop-color="#95783c"/>
    </radialGradient>
    <linearGradient id="ink" x1="120" y1="92" x2="392" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#233b37"/>
      <stop offset="1" stop-color="#0d1716"/>
    </linearGradient>
    <linearGradient id="aureate" x1="132" y1="88" x2="374" y2="434" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0d58a"/>
      <stop offset="0.48" stop-color="#b78738"/>
      <stop offset="1" stop-color="#74521f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#06100f" flood-opacity="0.22"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="224" fill="url(#ink)"/>
  <circle cx="256" cy="256" r="207" fill="none" stroke="url(#aureate)" stroke-width="14"/>
