[package]
name = "cognoscenti"
version = "0.1.0"
edition = "2021"
description = "Benchmark for evaluating cognitive memory systems inspired by ACT-R"
authors = ["Achiral"]
license = "Apache-2.0"
repository = "https://github.com/achiral/cognoscenti"
readme = "README.md"
keywords = ["benchmark", "cognitive", "memory", "ACT-R", "AI"]
categories = ["science", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
csv = "1.3"
statrs = "0.16"
plotters = "0.3"
printpdf = "0.6"
